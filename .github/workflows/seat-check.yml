name: Check bus seats

# GitHub's scheduler is slow and unreliable right now (runs arrive hours apart), so the
# job below keeps itself busy for ~5h40m, checking about every 30 minutes, and then starts
# the next run itself. The cron line is only a backup restart if that chain ever breaks.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a test notification to my phone"
        type: boolean
        default: false
      loop:
        description: "Keep checking every ~30 min for hours (leave off for a single check)"
        type: boolean
        default: false

permissions:
  contents: write   # commit state.json so alerts aren't repeated
  actions: write    # let a finished run start the next one

concurrency:
  group: seat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chrome

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          LOOP: ${{ github.event_name == 'schedule' || inputs.loop }}
        run: |
          if [ "$TEST_NOTIFY" = "true" ]; then
            python check_seats.py --test-notify
            exit 0
          fi
          if [ "$LOOP" != "true" ]; then
            python check_seats.py
            exit 0
          fi
          end=$((SECONDS + 20400))   # stop starting new checks after 340 minutes
          while true; do
            python check_seats.py || true
            [ $((SECONDS + 1500)) -ge $end ] && break
            sleep 1500               # plus ~2-4 min per check = roughly every 30 min
          done

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "seat-bot"
            git config user.email "seat-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update seat state"
            git push
          fi

      - name: Start the next run
        if: success() && (github.event_name == 'schedule' || inputs.loop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run seat-check.yml -f loop=true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 1
          if-no-files-found: ignore